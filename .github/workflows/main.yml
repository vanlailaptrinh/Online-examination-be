name: Build, Push & Deploy Docker

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # # 3️⃣ Build & push Docker image
      # - name: Build & Push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     push: true
      #     tags: vantrandevops/online-exam-be:latest

      # 4️⃣ Test SSH key trực tiếp (debug key)
      - name: Test EC2 SSH key
        run: |
          echo "$EC2_KEY" > test-key.pem
          chmod 600 test-key.pem
          ssh -o StrictHostKeyChecking=no -i test-key.pem ec2-user@52.221.192.117 "echo 'SSH connection OK'"
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      # 5️⃣ Deploy trên EC2 với appleboy SSH Action và debug bật
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: 52.221.192.117
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          key_encoding: 'base64'   # Bắt buộc khi dùng base64
          port: 22
          debug: true                 # bật log debug chi tiết
          script: |
            # Dừng container cũ
            docker stop online-exam-be || true
            docker rm online-exam-be || true

            # Xóa image cũ (tuỳ chọn)
            docker rmi vantrandevops/online-exam-be:latest || true

            # Kéo image mới
            docker pull vantrandevops/online-exam-be:latest

            # Chạy container mới
            docker-compose up -d
