name: Build, Push & Deploy Docker

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # 3. Build & push image
      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: vantrandevops/online-exam-be:latest

      # 4. SSH vào EC2 và deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Dừng container cũ
            docker stop online-exam-be || true
            docker rm online-exam-be || true

            # Xóa image cũ (tuỳ chọn)
            docker rmi vantrandevops/online-exam-be:latest || true

            # Kéo image mới
            docker pull vantrandevops/online-exam-be:latest

            # Chạy container mới
            docker run -d --name online-exam-be -p 8080:8080 vantrandevops/online-exam-be:latest
